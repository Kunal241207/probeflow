name: API tests

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"
      - run: python -m pip install -e ".[dev]"
      - name: Run full test suite
        run: python -m pytest
      - name: Run example API tests
        run: |
          python -m probeflow.cli test examples/simple.http
          python -m probeflow.cli test examples/requests.http --env dev
