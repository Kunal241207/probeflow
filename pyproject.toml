[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probeflow"
version = "0.1.0"
description = "Pytest for HTTP APIs using Git-diffable .http request files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "probeflow"},
]
dependencies = [
    "httpx>=0.27.0",
    "typer==0.27.0",
    "rich==15.0.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
probeflow = "probeflow.cli:app_entry"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.3.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "C4", "RUF"]
ignore = ["B008", "B904", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
